name: Build ASTRA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Show ASTRA version
        run: |
          echo "Checking app/build.gradle:"
          cat app/build.gradle

      - name: Build ASTRA APK
        run: gradle assembleDebug

      - name: Verify APK version
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "package: name=|versionCode=|versionName="

      - name: Upload ASTRA APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-Visit-Log-APK-v2.0
          path: app/build/outputs/apk/debug/app-debug.apk
